name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16-bookworm@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: geem_ai
          POSTGRES_USER: geem_ai
          POSTGRES_PASSWORD: geem_ai_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U geem_ai -d geem_ai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.2.15-alpine3.21@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      GEEM_APP_ENV: ci
      GEEM_DATABASE_URL: postgresql+psycopg://geem_ai:geem_ai_dev@localhost:5432/geem_ai
      GEEM_REDIS_URL: redis://localhost:6379/0
      GEEM_STORAGE_ENDPOINT: http://localhost:9000
      GEEM_STORAGE_BUCKET: geem-ai-documents
      GEEM_STORAGE_ACCESS_KEY: geem_ai
      GEEM_STORAGE_SECRET_KEY: geem_ai_dev_secret
      GEEM_OTEL_ENDPOINT: http://localhost:4317
      GEEM_DEV_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start MinIO
        run: |
          docker run -d --rm \
            --name geem-ai-minio \
            -e MINIO_ROOT_USER=geem_ai \
            -e MINIO_ROOT_PASSWORD=geem_ai_dev_secret \
            -p 9000:9000 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
      - name: Wait for MinIO
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:9000/minio/health/live > /dev/null; then
              exit 0
            fi

            sleep 1
          done

          docker logs geem-ai-minio
          exit 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - run: python -m pip install "uv==0.11.32"
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src apps
      - run: uv run alembic upgrade head
      - name: Run backend tests
        run: |
          mkdir -p artifacts
          uv run pytest \
            --junitxml=artifacts/junit.xml \
            --cov=src \
            --cov=apps \
            --cov-branch \
            --cov-fail-under=85 \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/coverage.xml
      - name: Export OpenAPI
        run: uv run python -m scripts.export_openapi
      - name: Validate OpenAPI artifact
        run: uv run openapi-spec-validator artifacts/openapi.json
      - name: Audit Python dependencies
        run: uv run pip-audit
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-evidence
          path: |
            artifacts/junit.xml
            artifacts/coverage.xml
            artifacts/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.20.2"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Audit Node dependencies
        run: pnpm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cp .env.example .env
      - name: Validate development container builds
        run: docker compose build
      - name: Build API image for security scan
        run: |
          docker build \
            -f docker/api.Dockerfile \
            -t geem-ai-assistant-api:${{ github.sha }} \
            .
      - name: Build production web image
        run: |
          docker build \
            --target production \
            -f docker/web.Dockerfile \
            -t geem-ai-assistant-web:${{ github.sha }} \
            .
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: geem-ai-assistant-api:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan production web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: geem-ai-assistant-web:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
