name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16-bookworm@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: geem_ai
          POSTGRES_USER: geem_ai
          POSTGRES_PASSWORD: geem_ai_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U geem_ai -d geem_ai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.2.15-alpine3.21@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      GEEM_APP_ENV: ci
      GEEM_DATABASE_URL: postgresql+psycopg://geem_ai:geem_ai_dev@localhost:5432/geem_ai
      GEEM_REDIS_URL: redis://localhost:6379/0
      GEEM_STORAGE_ENDPOINT: http://localhost:9000
      GEEM_STORAGE_BUCKET: geem-ai-documents
      GEEM_STORAGE_ACCESS_KEY: geem_ai
      GEEM_STORAGE_SECRET_KEY: geem_ai_dev_secret
      GEEM_OTEL_ENDPOINT: http://localhost:4317
      GEEM_DEV_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - run: python -m pip install "uv==0.11.16"
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src apps
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov=src --cov=apps

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
