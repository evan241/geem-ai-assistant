[project]
name = "geem-ai-assistant"
version = "0.1.0"
description = "Enterprise AI Assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "redis>=5.2,<6.0",
  "httpx>=0.28,<1.0",
  "boto3>=1.40,<2.0",
  "opentelemetry-api>=1.29,<2.0",
  "opentelemetry-sdk>=1.29,<2.0",
  "opentelemetry-exporter-otlp>=1.29,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<2.0",
  "types-redis>=4.6,<5.0",
  "pre-commit>=4,<5",
  "boto3-stubs[s3]>=1.40,<2.0",
  "pip-audit>=2.9,<3.0",
  "openapi-spec-validator>=0.7,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geem_ai"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["geem_ai"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: pruebas unitarias rápidas",
  "domain: pruebas de reglas de dominio",
  "application: pruebas de casos de uso",
  "repository: pruebas de persistencia",
  "integration: pruebas de integración",
  "api: pruebas de endpoint",
  "contract: pruebas de contrato",
  "worker: pruebas de workers y colas",
  "security: pruebas de seguridad",
  "ai_eval: evaluaciones de componentes de IA",
  "rag: evaluaciones del pipeline RAG",
  "prompt: pruebas de prompts",
  "tool_calling: pruebas de selección y ejecución de tools",
  "e2e: pruebas end-to-end",
  "performance: pruebas de rendimiento",
  "chaos: pruebas de resiliencia",
  "slow: pruebas lentas",
  "provider: pruebas que llaman proveedores externos",
]

[tool.coverage.run]
source = ["src", "apps"]
branch = true

[tool.uv]
required-version = "==0.11.32"
